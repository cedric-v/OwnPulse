# Cloudflare Worker config — Supabase keep-alive.
#
# Keeps the free-tier Supabase project from being paused (7-day inactivity
# policy). Each cron run executes a real Postgres-backed query on the
# `contact_urls` view (unambiguous activity) with the health endpoint as a
# second signal — see src/index.js.
#
# Deploy:
#   cd keepalive-worker
#   npx wrangler@latest login
#   npx wrangler@latest secret put SUPABASE_URL        # https://<project-ref>.supabase.co (no trailing slash)
#   npx wrangler@latest secret put SUPABASE_ANON_KEY   # publishable anon key (Supabase dashboard > API)
#   npx wrangler@latest deploy
#
# Verify: curl "https://ownpulse-supabase-keepalive.<your-subdomain>.workers.dev/ping" → OK

name = "ownpulse-supabase-keepalive"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# View used by the PostgREST ping. It must exist and be exposed to the
# `anon` role (explicit GRANT — new Supabase projects no longer expose
# public objects to the Data API by default). See hardening_security_rls.sql.
KEEPALIVE_TABLE = "contact_urls"

# Ping every 6 hours (free tier supports cron triggers; 7-day pause window).
[triggers]
crons = ["0 */6 * * *"]

# ── Cloudflare Observability (Workers Logs) ────────────────────────────────
# Le 1er décembre 2026, Cloudflare passe l'Observability à une tarification
# au volume : le plan gratuit offre 0,5 Go d'ingestion par jour (7 jours de
# rétention). Au-delà, l'ingestion se met en pause (aucun site en panne, mais
# plus de logs).
#
# Ce Worker est déclenché par cron (toutes les 15 à 20 minutes) : son volume
# de logs est dérisoire, et ses erreurs sont déjà remontées par e-mail
# (Mailjet). On désactive donc complètement l'Observability : aucun volume
# ingéré, aucune part du quota gratuit consommée.
#
# Attention : ce worker signalait ses erreurs par e-mail ET laissait des
# traces en console. Après ce changement, seul l'e-mail reste : c'est le
# canal qui déclenche une action, pas le log.
#
# Référence : tools/docs/cloudflare-observability.md
[observability]
enabled = false
